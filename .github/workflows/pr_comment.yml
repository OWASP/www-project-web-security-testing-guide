name: PR Comment

on:
  pull_request:
    types:
      - opened

permissions:
  contents: read

jobs:
  PR-Comment:
    if: github.actor != 'kingthorin' && github.actor != 'wstgbot' && github.actor != 'ThunderSon' && github.actor != 'rejahrehim' && github.actor != 'victoriadrake'  && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - name: Create comment artifact
      run: |
        echo ':warning: Have you followed the [contributions guidance](https://owasp.org/www-project-web-security-testing-guide/#contributions)? Content PRs should generally be made against the [source repo `OWASP/wstg`](https://github.com/OWASP/wstg).' > artifact.txt
    - name: Upload comment artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: artifact
        path: artifact.txt
